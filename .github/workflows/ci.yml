name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    name: Type check (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  schema-drift:
    name: Schema drift check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: qualityguard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install server deps
        working-directory: server
        run: npm ci
      # ubuntu-latest ships the postgresql client (pg_dump) on PATH.
      - name: Check schema.snapshot.sql is in sync
        working-directory: server
        run: node scripts/schema-check.js

  # The full server test suite also needs a live PostgreSQL (schema +
  # seed + migrations). Same setup as above, larger; wiring it in is
  # a follow-up.
