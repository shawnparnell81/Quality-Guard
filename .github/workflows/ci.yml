name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    name: Type check (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # The server test suite needs a live PostgreSQL with the schema and
  # seed applied. Wiring that up (a postgres service container + a
  # migration runner) is roadmap item P4.2; add the job here then.
