version: 2
updates:
  # Server runtime + test deps
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      server-minor-and-patch:
        update-types: [minor, patch]

  # Root: the TypeScript type-checker only, no build
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
