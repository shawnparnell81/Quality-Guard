<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in - QualityGuard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="signin-page">
    <div class="signin-card">
        <div class="signin-brand">
            <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true" style="width:30px;height:30px">
                <rect x="1.5" y="1.5" width="29" height="29" rx="4" stroke="#A8703A" stroke-width="1.5"/>
                <path d="M8 24 L16 8 L24 24" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                <path d="M6 24 H26" stroke="#A8703A" stroke-width="2" stroke-linecap="round"/>
                <circle cx="16" cy="24" r="2.4" fill="#A8703A"/>
            </svg>
            <div>
                <div class="brand-name">QualityGuard</div>
                <span class="brand-sub">QMS / ISO 9001</span>
            </div>
        </div>

        <div class="signin-panel">
            <h1 class="signin-title">Sign in</h1>
            <p class="signin-sub">Quality management, one place</p>

            <div class="signin-error" id="signin-error" hidden></div>

            <form id="signin-form" novalidate>
                <div class="field-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="username" required>
                </div>

                <div class="field-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>

                <!-- DEV ONLY - remove this field before launch. Checking it
                     asks the server for a 30-day session instead of the
                     usual 12 hours, purely so sign-in doesn't happen over
                     and over while building. Never stores the password
                     itself anywhere; the server also ignores this outside
                     development, so it does nothing even if this markup
                     is left in by mistake. -->
                <div class="field-group" style="display:flex;flex-direction:row;align-items:center;gap:6px">
                    <input type="checkbox" id="remember" name="remember" style="width:auto">
                    <label for="remember" style="margin:0">Remember me (dev only)</label>
                </div>

                <button type="submit" class="signin-submit" id="signin-submit">Sign in</button>
            </form>
        </div>
    </div>
</div>

<script type="module">
const form = document.getElementById("signin-form");
const errorBox = document.getElementById("signin-error");
const submit = document.getElementById("signin-submit");

function showError(message) {
    errorBox.textContent = message;
    errorBox.hidden = false;
}

form.addEventListener("submit", async (event) => {
    event.preventDefault();
    errorBox.hidden = true;
    submit.disabled = true;
    submit.textContent = "Signing in...";

    try {
        const response = await fetch("/api/auth/login", {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                email: document.getElementById("email").value.trim(),
                password: document.getElementById("password").value,
                remember: document.getElementById("remember").checked
            })
        });

        const payload = await response.json().catch(() => ({}));

        if (!response.ok) {
            showError(payload.error || "Could not sign in");
            return;
        }

        /* A temporary password gets you exactly one place: the screen
           that replaces it. */
        window.location.href = payload.must_change_password
            ? "/change-password.html"
            : "/app";
    } catch {
        showError("Cannot reach the server. Is it running on port 3001?");
    } finally {
        submit.disabled = false;
        submit.textContent = "Sign in";
    }
});

document.getElementById("email").focus();
</script>
</body>
</html>
