<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set your password - QMS Guardian</title>
<link rel="icon" href="/img/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="signin-page">
    <div class="signin-card">
        <div class="signin-brand">
            <img class="signin-logo" src="/img/qms-guardian-logo.png"
                 alt="QMS Guardian - Quality Management System">
        </div>

        <div class="signin-panel">
            <h1 class="signin-title">Set your password</h1>
            <p class="signin-sub" id="who">Loading...</p>

            <div class="signin-notice" id="forced-notice" hidden>
                You are signed in with a temporary password. Choose your own before
                you can use the system.
            </div>

            <div class="signin-error" id="error-box" hidden></div>

            <form id="change-form" novalidate>
                <div class="field-group">
                    <label for="current">Current password</label>
                    <input type="password" id="current" autocomplete="current-password" required>
                </div>

                <div class="field-group">
                    <label for="next">New password</label>
                    <input type="password" id="next" autocomplete="new-password" required>
                    <span class="field-hint">At least 12 characters. Length matters more than symbols.</span>
                </div>

                <div class="field-group">
                    <label for="confirm">Repeat new password</label>
                    <input type="password" id="confirm" autocomplete="new-password" required>
                </div>

                <button type="submit" class="signin-submit" id="submit">Set password</button>
            </form>

            <div class="signin-foot">
                Changing your password signs you out everywhere else. If somebody
                else knew the old one, that ends their access too.
            </div>
        </div>
    </div>
</div>

<script type="module" src="/js/change-password.js"></script>
</body>
</html>
